<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ssaaxcy Solutions — Translation Services</title>
  <meta name="description" content="Certified and plain document translation in German, English and Tamil — permits, visas, official forms, insurance, bank and employment documents.">
  <link rel="icon" href="assets/brand/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header" data-slot="header">
    <div class="container header-inner"></div>
  </header>

  <section class="page-hero">
    <div class="container">
      <div class="breadcrumb"><a href="index.html" data-i18n="nav.home"></a> → <span data-i18n="nav.translation"></span></div>
      <h1 data-i18n="trans.title"></h1>
      <p data-i18n="trans.subtitle"></p>
      <div style="margin-top:22px;">
        <div class="lang-pair-list">
          <span class="lang-pair-chip">Deutsch <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" class="sv"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg> English</span>
          <span class="lang-pair-chip">Deutsch <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" class="sv"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg> தமிழ்</span>
          <span class="lang-pair-chip">English <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" class="sv"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg> தமிழ்</span>
        </div>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="section-head center">
        <span class="eyebrow" data-i18n="trans.docs"></span>
        <h2 class="section-title" data-i18n="trans.docsTitle"></h2>
        <p class="section-intro" data-i18n="trans.docsSub"></p>
      </div>
      <div class="doc-grid">
        <div class="doc-card"><div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" width="24" height="24" class="sv"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6"/></svg></div><h3 data-i18n="doc.residence"></h3><p data-i18n="doc.residenceDesc"></p></div>
        <div class="doc-card"><div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" width="24" height="24" class="sv"><rect x="2" y="4" width="20" height="16" rx="2"/><circle cx="8" cy="10" r="2"/><path d="M5 16a3 3 0 0 1 6 0"/><path d="M15 9h4M15 13h4"/></svg></div><h3 data-i18n="doc.visa"></h3><p data-i18n="doc.visaDesc"></p></div>
        <div class="doc-card"><div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" width="24" height="24" class="sv"><path d="M3 21h18"/><path d="M7 21v-8M12 21v-8M17 21v-8"/><path d="M4 13 12 6l8 7"/><path d="M4 8V5L12 2l8 3v3"/></svg></div><h3 data-i18n="doc.gov"></h3><p data-i18n="doc.govDesc"></p></div>
        <div class="doc-card"><div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" width="24" height="24" class="sv"><path d="M12 3a9 9 0 0 0-9 9h18a9 9 0 0 0-9-9z"/><path d="M12 12v7a2 2 0 0 0 4 0"/></svg></div><h3 data-i18n="doc.insurance"></h3><p data-i18n="doc.insuranceDesc"></p></div>
        <div class="doc-card"><div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" width="24" height="24" class="sv"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/></svg></div><h3 data-i18n="doc.bank"></h3><p data-i18n="doc.bankDesc"></p></div>
        <div class="doc-card"><div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" width="24" height="24" class="sv"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/><path d="M3 12h18"/></svg></div><h3 data-i18n="doc.work"></h3><p data-i18n="doc.workDesc"></p></div>
        <div class="doc-card"><div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" width="24" height="24" class="sv"><path d="M12 3 2 8l10 5 10-5-10-5z"/><path d="M6 10v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5"/><path d="M22 8v6"/></svg></div><h3 data-i18n="doc.edu"></h3><p data-i18n="doc.eduDesc"></p></div>
        <div class="doc-card"><div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" width="24" height="24" class="sv"><path d="M12 3l2.7 5.6 6.3.9-4.5 4.4 1 6.1-5.5-2.9-5.5 2.9 1-6.1L3 9.5l6.3-.9z"/></svg></div><h3 data-i18n="doc.other"></h3><p data-i18n="doc.otherDesc"></p></div>
      </div>
    </div>
  </section>

  <section class="section-tight" style="background:var(--white);border-block:1px solid var(--line);">
    <div class="container">
      <div class="section-head center">
        <span class="eyebrow" data-i18n="trans.fees"></span>
        <h2 class="section-title" data-i18n="trans.feesTitle"></h2>
      </div>
      <div class="fee-strip">
        <div class="fee-item">
          <div class="amount" id="fee-plain">CHF 125<small data-i18n="fee.perDoc"></small></div>
          <h4 data-i18n="fee.plain"></h4>
          <p data-i18n="fee.plainNote"></p>
        </div>
        <div class="fee-item bronze">
          <div class="amount" id="fee-cert">CHF 120<small data-i18n="fee.perDoc"></small></div>
          <h4 data-i18n="fee.cert"></h4>
          <p data-i18n="fee.certNote"></p>
        </div>
        <div class="fee-item">
          <div class="amount" id="fee-lastmin">+ 25<small data-i18n="fee.lastMinShort"></small></div>
          <h4 data-i18n="fee.lastMin"></h4>
          <p data-i18n="fee.lastMinNote"></p>
        </div>
        <div class="fee-item">
          <div class="amount" id="fee-urgent">+ 15<small data-i18n="fee.urShort"></small></div>
          <h4 data-i18n="fee.ur"></h4>
          <p data-i18n="fee.urNote"></p>
        </div>
      </div>
      <p class="tiny muted" style="text-align:center;margin-top:20px;" data-i18n="fee.minNote"></p>
    </div>
  </section>

  <section class="section">
    <div class="container" style="max-width:760px;">
      <div class="section-head center">
        <span class="eyebrow" data-i18n="trans.order"></span>
        <h2 class="section-title" data-i18n="trans.orderSub"></h2>
      </div>
      <div class="form-panel">
        <form id="trans-form" novalidate>
          <div class="two-col">
            <div class="field"><label data-i18n="cf.fullName"></label><input class="input" id="t-name" data-ph="cf.fullName"></div>
            <div class="field"><label data-i18n="cf.email"></label><input class="input" id="t-email" type="email" data-ph="ph.email"></div>
          </div>
          <div class="two-col">
            <div class="field"><label data-i18n="trans.fromLang"></label>
              <select class="select" id="t-from"></select>
            </div>
            <div class="field"><label data-i18n="trans.toLang"></label>
              <select class="select" id="t-to"></select>
            </div>
          </div>
          <div class="field">
            <label data-i18n="trans.docType"></label>
            <select class="select" id="t-doctype">
              <option value="residence" data-i18n="doc.residence"></option>
              <option value="visa" data-i18n="doc.visa"></option>
              <option value="gov" data-i18n="doc.gov"></option>
              <option value="insurance" data-i18n="doc.insurance"></option>
              <option value="bank" data-i18n="doc.bank"></option>
              <option value="work" data-i18n="doc.work"></option>
              <option value="edu" data-i18n="doc.edu"></option>
              <option value="other" data-i18n="doc.other"></option>
            </select>
          </div>
          <div class="field"><label data-i18n="cf.message"></label>
            <textarea class="textarea" id="t-detail" data-ph="trans.detailPh"></textarea>
          </div>
          <label class="consent-line"><input type="checkbox" id="t-consent"> <span data-i18n="privacy.consent"></span> (<a href="privacy.html" target="_blank" rel="noopener" data-i18n="privacy.link"></a>)</label>
          <button type="submit" class="btn btn-primary btn-lg btn-block" id="t-submit" data-i18n="trans.orderCta"></button>
          <p class="tiny muted" style="text-align:center;margin-top:12px;" data-i18n="cf.noPay"></p>
        </form>
      </div>
    </div>
  </section>

  <footer class="site-footer" data-slot="footer"></footer>

  <script src="js/icons.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
  <script>
    SSX.injectLangSwitcher(document);

    var fromSel = document.getElementById("t-from");
    var toSel = document.getElementById("t-to");
    SSX.languages.forEach(function (l) {
      fromSel.appendChild(new Option(SSX.t("lang." + l.code), l.code));
      toSel.appendChild(new Option(SSX.t("lang." + l.code), l.code));
    });
    if (fromSel.options.length) fromSel.value = SSX.lang === "de" ? "DE" : SSX.lang === "ta" ? "TA" : "EN";
    if (toSel.options.length) toSel.value = fromSel.value === "TA" ? "DE" : "TA";

    document.getElementById("trans-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var name = document.getElementById("t-name").value.trim();
      var email = document.getElementById("t-email").value.trim();
      var detail = document.getElementById("t-detail").value.trim();
      if (!name) { SSX.toast(SSX.t("err.name"), "error"); return; }
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { SSX.toast(SSX.t("err.email"), "error"); return; }
      if (!detail) { SSX.toast(SSX.t("err.detail"), "error"); return; }
      if (!document.getElementById("t-consent").checked) { SSX.toast(SSX.t("privacy.consentRequired"), "error"); return; }

      var payload = {
        service: "translation",
        title: document.getElementById("t-doctype").selectedOptions[0] && document.getElementById("t-doctype").selectedOptions[0].textContent,
        language_code: fromSel.value,
        language_name: fromSel.selectedOptions[0].textContent + " → " + toSel.selectedOptions[0].textContent,
        detail: detail,
        customer: name,
        email: email,
        phone: "",
        files: "",
        consent: true
      };

      var btn = document.getElementById("t-submit");
      btn.disabled = true;
      btn.textContent = SSX.t("cf.sending");

      var finish = function (ref) {
        var modal = SSX.openModal(
          "<h3>" + SSX.t("cf.sentTitle") + "</h3>" +
          "<p class=\"muted\" style=\"margin:12px 0;\">" + SSX.t("cf.ref") + " <b>" + SSX.helpers.esc(ref) + "</b><br>" +
          SSX.t("cf.sentBody") + " " + SSX.helpers.esc(payload.email) + "</p>" +
          '<button type="button" class="btn btn-primary" onclick="this.closest(\'.modal-backdrop\').remove()">' + SSX.t("common.ok") + "</button>");
        document.getElementById("trans-form").reset();
      };

      if (SSX.http) {
        SSX.request("POST", "/api/concierge", payload).then(function (res) {
          btn.disabled = false; btn.textContent = SSX.t("trans.orderCta");
          finish(res.ref);
        }).catch(function (err) {
          btn.disabled = false; btn.textContent = SSX.t("trans.orderCta");
          SSX.toast(err.message || SSX.t("err.general"), "error");
        });
      } else {
        setTimeout(function () {
          btn.disabled = false; btn.textContent = SSX.t("trans.orderCta");
          finish(SSX.ref("SSXT"));
        }, 500);
      }
    });
  </script>
</body>
</html>
