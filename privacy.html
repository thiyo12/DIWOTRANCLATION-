<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ssaaxcy Solutions — Privacy policy</title>
  <meta name="description" content="Privacy policy of Ssaaxcy Solutions, Zurich, Switzerland — how we handle your personal data.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/brand/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header" data-slot="header">
    <div class="container header-inner"></div>
  </header>

  <section class="section">
    <div class="container" style="max-width:820px;">
      <div class="section-head center">
        <span class="eyebrow" data-i18n="privacy.pageTitle"></span>
        <h1 class="section-title" data-i18n="privacy.pageTitle"></h1>
        <p class="muted" id="p-updated"></p>
      </div>

      <div class="card" style="padding:36px 40px;text-align:left;">
        <div class="prose">
          <h2 data-i18n="privacy.s1Title"></h2>
          <p data-i18n="privacy.s1Body"></p>

          <h2 data-i18n="privacy.s2Title"></h2>
          <p data-i18n="privacy.s2Body"></p>

          <h2 data-i18n="privacy.s3Title"></h2>
          <p data-i18n="privacy.s3Body"></p>

          <h2 data-i18n="privacy.s4Title"></h2>
          <p data-i18n="privacy.s4Body"></p>

          <h2 data-i18n="privacy.s5Title"></h2>
          <p data-i18n="privacy.s5Body"></p>

          <h2 data-i18n="privacy.s6Title"></h2>
          <p data-i18n="privacy.s6Body"></p>

          <h2 data-i18n="privacy.s7Title"></h2>
          <p data-i18n="privacy.s7Body"></p>

          <h2 data-i18n="privacy.contactTitle"></h2>
          <p data-i18n="privacy.contactBody"></p>
          <p class="muted" id="p-contact"></p>
        </div>
      </div>
    </div>
  </section>

  <footer class="site-footer" data-slot="footer"></footer>

  <script src="js/icons.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
  <script>
    SSX.injectLangSwitcher(document);
    document.addEventListener("DOMContentLoaded", function () {
      var d = new Date(2026, 7, 11);
      document.getElementById("p-updated").textContent = SSX.t("privacy.lastUpdated") + ": " + d.toLocaleDateString();
      var contact = document.getElementById("p-contact");
      var email = SSX.settings.supportEmail || "hello@ssaaxcy.ch";
      contact.innerHTML = '<a href="mailto:' + SSX.helpers.esc(email) + '">' + SSX.helpers.esc(email) + '</a>';
    });
  </script>
</body>
</html>
