<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interpreters — Ssaaxcy Admin</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="../assets/brand/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <script src="js/admin.js"></script>
  <script>
    var ALL = [];

    document.addEventListener("DOMContentLoaded", function () {
      SS.guard().then(function (ok) {
        if (!ok) return;
        SS.shell("interpreters", "Interpreters", "Team management");
        var c = document.getElementById("content");
        c.innerHTML =
          '<div class="toolbar"><button class="btn btn-red btn-sm" id="btn-add">+ Add interpreter</button></div>' +
          '<div class="card"><div class="table-wrap"><table class="tbl" id="tbl"></table></div></div>';
        document.getElementById("btn-add").addEventListener("click", function () { editModal(null); });
        load();
      });
    });

    function load() {
      SS.get("/admin/api/interpreters").then(function (d) {
        ALL = d.items;
        render();
      }).catch(function (e) { SS.toast(e.message, "error"); });
    }

    function render() {
      var t = document.getElementById("tbl");
      if (!ALL.length) { t.innerHTML = '<tr><td class="empty">No interpreters yet.</td></tr>'; return; }
      var head = "<thead><tr><th>Name</th><th>Languages</th><th>Zones</th><th>Assignments</th><th>Rating</th><th>Status</th><th></th></tr></thead>";
      var rows = ALL.map(function (i) {
        var langs = (i.languages || "").split(",").map(function (code) { return code.trim(); }).join(", ");
        return "<tr>" +
          "<td><b>" + SS.txt(i.name) + "</b><br><span class='muted small'>" + SS.txt(i.phone) + "</span></td>" +
          "<td>" + SS.txt(langs) + "</td>" +
          "<td>" + SS.txt(i.zones) + "</td>" +
          "<td>" + SS.esc(i.assignments || 0) + "</td>" +
          "<td>" + SS.icon("handshake", 13) + "&nbsp;" + SS.txt(i.rating) + "</td>" +
          "<td>" + SS.badge(i.active ? "active" : "offline") + "</td>" +
          "<td><button class='icon-btn' onclick='editModal(" + i.id + ")'>" + SS.icon("edit", 14) + " Edit</button>" +
          " <button class='icon-btn danger' onclick='delItem(" + i.id + ")'>" + SS.icon("trash", 14) + "</button></td>" +
          "</tr>";
      }).join("");
      t.innerHTML = head + rows;
    }

    window.delItem = function (id) {
      var i = null;
      ALL.forEach(function (x) { if (x.id === id) i = x; });
      SS.confirm("Remove " + (i ? i.name : "interpreter") + "?", function () {
        SS.del("/admin/api/interpreters/" + id).then(function () { load(); SS.toast("Interpreter removed.", "success"); });
      });
    };

    window.editModal = function (id) {
      var i = null;
      ALL.forEach(function (x) { if (x.id === id) i = x; });
      var m = SS.modal(
        '<h2>' + (i ? "Edit interpreter" : "Add interpreter") + '</h2>' +
        '<div class="grid-2">' +
        '<div class="field"><label>Full name</label><input class="input" id="i-name" value="' + SS.esc((i && i.name) || "") + '"></div>' +
        '<div class="field"><label>Phone</label><input class="input" id="i-phone" value="' + SS.esc((i && i.phone) || "") + '"></div>' +
        '</div>' +
        '<div class="field"><label>Languages <span class="muted small">(comma-separated codes, e.g. DE,PT,FR)</span></label><input class="input" id="i-langs" value="' + SS.esc((i && i.languages) || "") + '"></div>' +
        '<div class="field"><label>Regions / Zones</label><input class="input" id="i-zones" value="' + SS.esc((i && i.zones) || "") + '"></div>' +
        '<div class="two-col mx">' +
        '<div class="field" style="padding-right:9px;"><label>Rating</label><input class="input" id="i-rating" type="number" step="0.1" value="' + SS.esc((i && i.rating) || "") + '"></div>' +
        '<div class="field"><label>Assignments</label><input class="input" id="i-assign" type="number" value="' + SS.esc((i && i.assignments) || "") + '"></div>' +
        '</div>' +
        '<label class="flex mb"><input type="checkbox" id="i-active" ' + (i && !i.active ? "" : "checked") + '> <span>Active (accepts bookings)</span></label>' +
        '<button class="btn btn-red btn-block" id="i-save">Save interpreter</button>'
      );
      var payload = function () {
        return {
          name: m.querySelector("#i-name").value,
          phone: m.querySelector("#i-phone").value,
          languages: m.querySelector("#i-langs").value,
          zones: m.querySelector("#i-zones").value,
          rating: m.querySelector("#i-rating").value,
          assignments: m.querySelector("#i-assign").value,
          active: m.querySelector("#i-active").checked ? 1 : 0
        };
      };
      m.querySelector("#i-save").onclick = function () {
        var p = payload();
        if (!p.name.trim()) { SS.toast("Name is required.", "error"); return; }
        var req = i ? SS.patch("/admin/api/interpreters/" + id, p) : SS.post("/admin/api/interpreters", p);
        req.then(function () { m.remove(); load(); SS.toast("Interpreter saved.", "success"); })
          .catch(function (e) { SS.toast(e.message, "error"); });
      };
    };
  </script>
</body>
</html>
