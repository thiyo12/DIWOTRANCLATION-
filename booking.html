<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ssaaxcy Solutions — Book an appointment</title>
  <meta name="description" content="Book a professional interpreter in German, English or Tamil — for doctor, hospital, police, immigration, Gemeinde, school, bank and insurance appointments.">
  <link rel="icon" href="assets/brand/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header" data-slot="header">
    <div class="container header-inner"></div>
  </header>

  <section class="section-tight">
    <div class="container">
      <span class="eyebrow" data-i18n="booking.eyebrow"></span>
      <h1 class="section-title" style="font-size:1.9rem;" data-i18n="booking.title"></h1>
      <p class="muted" style="margin-bottom:22px;" data-i18n="booking.subtitle"></p>

      <div class="stepper" id="stepper"></div>

      <div class="wizard">
        <div class="wizard-body" id="wizard">
          <h2 id="step-title"></h2>
          <p class="step-hint" id="step-hint"></p>
          <div id="step-content"></div>
          <div class="wizard-footer">
            <div>
              <button class="btn btn-light" id="btn-prev" style="visibility:hidden;" data-i18n="common.back"></button>
            </div>
            <div class="right">
              <button class="btn btn-primary" id="btn-next">Continue →</button>
            </div>
          </div>
        </div>

        <aside class="summary-card">
          <div class="summary-head" data-i18n="booking.summary"></div>
          <div class="summary-body" id="summary-body"></div>
          <div class="secure-note"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg> &nbsp;<span data-i18n="hero.floatSub"></span></div>
        </aside>
      </div>
    </div>
  </section>

  <footer class="site-footer" data-slot="footer"></footer>

  <script src="js/icons.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
  <script src="js/booking.js"></script>
</body>
</html>
