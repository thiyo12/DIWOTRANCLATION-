<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ssaaxcy Solutions — Swiss Digital Concierge</title>
  <meta name="description" content="Interpreters, document translation and a personal concierge for your Swiss life — in German, English and Tamil.">
  <link rel="icon" href="assets/brand/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header" data-slot="header">
    <div class="container header-inner"></div>
  </header>

  <section class="hero">
    <div class="container hero-grid">
      <div>
        <span class="eyebrow" data-i18n="home.eyebrow"></span>
        <h1 class="hero-title" data-i18n="home.heroTitle"></h1>
        <p class="hero-sub" data-i18n="home.heroSub"></p>
        <div class="hero-actions">
          <a href="booking.html" class="btn btn-primary btn-lg" data-i18n="home.heroCta"></a>
          <a href="concierge.html" class="btn btn-ghost btn-lg" data-i18n="home.heroCtaConcierge"></a>
        </div>
        <div class="hero-proof">
          <div class="proof-item"><b data-i18n="home.heroLanguages"></b><span data-i18n="home.trusted.who"></span></div>
          <div class="proof-item"><b>2'800+</b><span data-i18n="home.trusted.whoSub"></span></div>
          <div class="proof-item"><b>4.9 / 5</b><span>Google · Trustpilot</span></div>
        </div>
      </div>

      <div class="hero-visual">
        <div class="hero-flag" data-flag="auto"><span class="flag-cross"></span></div>
        <div class="live-card">
          <div class="live-pulse">
            <div class="avatar" style="background:linear-gradient(135deg,#3a3f48,#1d212a)">SS</div>
            <span class="dot-live"></span>
          </div>
          <div class="demo-caption">
            <b data-i18n="common.preferred"></b>
            <span data-i18n="tag.videoLive"></span>
          </div>
          <span class="lang-chip" style="background:var(--pine)">● <span data-i18n="live.tag"></span></span>
        </div>
        <div style="height:26px"></div>
        <p class="chat-bubble" data-i18n="demo.bubble1"></p>
        <div style="height:12px"></div>
        <p class="chat-bubble" data-i18n="demo.bubble2"></p>
        <div style="height:26px"></div>
        <div class="live-card" style="background: rgba(255,255,255,0.06);">
          <div class="live-pulse"><div class="avatar" style="background:linear-gradient(135deg,#3a3f45,#1F2A)">KA</div></div>
          <div class="demo-caption"><b data-i18n="demo.people"></b><span data-i18n="demo.appt"></span></div>
          <span class="lang-chip" style="background:var(--pine)">● <span data-i18n="live.secure"></span></span>
        </div>
        <div class="hero-float">
          <span class="float-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" width="18" height="18"><path d="M12 3 4 7v6c0 5.2 3.4 8.4 8 10 4.6-1.6 8-4.8 8-10V7l-8-4z"/></svg></span>
          <span><b data-i18n="hero.floatTitle"></b><span data-i18n="hero.floatSub"></span></span>
        </div>
      </div>
    </div>
  </section>

  <section class="trustbar">
    <div class="container trustbar-inner">
      <span class="trustbar-item"><span class="tick">✓</span> <span data-i18n="trust.vetted"></span></span>
      <span class="trustbar-item"><span class="tick">✓</span> <span data-i18n="trust.week"></span></span>
      <span class="trustbar-item"><span class="tick">✓</span> <span data-i18n="trust.cantons"></span></span>
      <span class="trustbar-item"><span class="tick">✓</span> <span data-i18n="trust.confidential"></span></span>
      <span class="trustbar-item"><span class="tick">✓</span> <span data-i18n="trust.cancel"></span></span>
    </div>
  </section>

  <section class="section" id="services">
    <div class="container">
      <div class="section-head center">
        <span class="eyebrow" data-i18n="svc.eyebrow"></span>
        <h2 class="section-title" data-i18n="services.title"></h2>
        <p class="section-intro" data-i18n="services.subtitle"></p>
      </div>
      <div class="service-grid" id="home-services"></div>
      <div style="text-align:center;margin-top:34px;">
        <a href="services.html" class="btn btn-dark" data-i18n="home.btnViewServices"></a>
      </div>
    </div>
  </section>

  <section class="section-tight" style="background:var(--white);border-block:1px solid var(--line);">
    <div class="container">
      <div class="section-head center">
        <span class="eyebrow" data-i18n="steps.eyebrow"></span>
        <h2 class="section-title" data-i18n="home.sectionHow"></h2>
      </div>
      <div class="steps-grid">
        <div class="step-card card"><div class="step-num"></div><h3 data-i18n="home.how1Title"></h3><p data-i18n="home.how1Body"></p></div>
        <div class="step-card card"><div class="step-num"></div><h3 data-i18n="home.how2Title"></h3><p data-i18n="home.how2Body"></p></div>
        <div class="step-card card"><div class="step-num"></div><h3 data-i18n="home.how3Title"></h3><p data-i18n="home.how3Body"></p></div>
        <div class="step-card card"><div class="step-num"></div><h3 data-i18n="trust.cancel"></h3><p data-i18n="home.how1Body"></p></div>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="container split">
      <div>
        <span class="eyebrow" data-i18n="svc.eyebrow"></span>
        <h2 class="section-title" data-i18n="why.title"></h2>
        <p class="lead" data-i18n="why.lead"></p>
        <ul class="check-list">
          <li><span class="check">✓</span><div><b data-i18n="why.video.t"></b><span data-i18n="why.video.d"></span></div></li>
          <li><span class="check">✓</span><div><b data-i18n="why.site.t"></b><span data-i18n="why.site.d"></span></div></li>
          <li><span class="check">✓</span><div><b data-i18n="why.human.t"></b><span data-i18n="why.human.d"></span></div></li>
        </ul>
      </div>
      <div class="visual-card">
        <div class="vc-inner">
          <h3 style="color:#fff;" data-i18n="why.visTitle"></h3>
          <p style="color:rgba(255,255,255,0.75);margin-top:12px;" data-i18n="why.visBody"></p>
          <ul class="check-list" style="margin-top:22px;">
            <li><span class="check" style="background:rgba(180,31,43,0.35);color:#fff">✓</span><div><b data-i18n="why.vis1.t"></b><span data-i18n="why.vis1.d"></span></div></li>
            <li><span class="check" style="background:rgba(180,31,43,0.35);color:#fff">✓</span><div><b data-i18n="why.vis2.t"></b><span data-i18n="why.vis2.d"></span></div></li>
            <li><span class="check" style="background:rgba(180,31,43,0.35);color:#fff">✓</span><div><b data-i18n="why.vis3.t"></b><span data-i18n="why.vis3.d"></span></div></li>
          </ul>
        </div>
      </div>
    </div>
  </section>

  <section class="section" style="padding-top:0;">
    <div class="container">
      <div class="band band-trans">
        <div>
          <h2 data-i18n="con.home.title"></h2>
          <p data-i18n="con.home.body"></p>
        </div>
        <a class="btn btn-light btn-lg" href="concierge.html" data-i18n="home.heroCtaConcierge"></a>
      </div>
    </div>
  </section>

  <section class="section-tight" style="padding-top:0;background:var(--white);border-block:1px solid var(--line);">
    <div class="container">
      <div class="section-head center">
        <span class="eyebrow" data-i18n="trans.eyebrow"></span>
        <h2 class="section-title" data-i18n="trans.title"></h2>
        <p class="section-intro" data-i18n="trans.subtitle"></p>
      </div>
      <div class="split" style="align-items:center;">
        <div class="doc-grid" style="grid-template-columns:repeat(auto-fill,minmax(240px,1fr));">
          <div class="doc-card"><div class="icon" data-icon="file-text"></div><h3 data-i18n="doc.residence"></h3></div>
          <div class="doc-card"><div class="icon" data-icon="id-card"></div><h3 data-i18n="doc.visa"></h3></div>
          <div class="doc-card"><div class="icon" data-icon="government"></div><h3 data-i18n="doc.gov"></h3></div>
          <div class="doc-card"><div class="icon" data-icon="umbrella"></div><h3 data-i18n="doc.insurance"></h3></div>
          <div class="doc-card"><div class="icon" data-icon="banknote"></div><h3 data-i18n="doc.bank"></h3></div>
          <div class="doc-card"><div class="icon" data-icon="briefcase"></div><h3 data-i18n="doc.work"></h3></div>
        </div>
        <div style="text-align:center;">
          <a href="translation.html" class="btn btn-primary btn-lg" data-i18n="home.btnHowNow"></a>
        </div>
      </div>
    </div>
  </section>

  <section class="section" style="padding-top:0;">
    <div class="container" style="max-width:760px;">
      <div class="section-head center">
        <span class="eyebrow" data-i18n="faq.eyebrow"></span>
        <h2 class="section-title" data-i18n="faq.title"></h2>
      </div>
      <div>
        <div class="faq-item">
          <button class="faq-q" data-i18n="faq1.q"> <span class="chev">▾</span></button>
          <div class="faq-a"><p data-i18n="faq1.a"></p></div>
        </div>
        <div class="faq-item">
          <button class="faq-q" data-i18n="faq2.q"> <span class="chev">▾</span></button>
          <div class="faq-a"><p data-i18n="faq2.a"></p></div>
        </div>
        <div class="faq-item">
          <button class="faq-q" data-i18n="faq3.q"> <span class="chev">▾</span></button>
          <div class="faq-a"><p data-i18n="faq3.a"></p></div>
        </div>
        <div class="faq-item">
          <button class="faq-q" data-i18n="faq4.q"> <span class="chev">▾</span></button>
          <div class="faq-a"><p data-i18n="faq4.a"></p></div>
        </div>
      </div>
    </div>
  </section>

  <footer class="site-footer" data-slot="footer"></footer>

  <script src="js/icons.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
  <script>
    SSX.injectLangSwitcher(document);
    var grid = document.getElementById("home-services");
    SSX.services.forEach(function (s) {
      var a = document.createElement("a");
      a.className = "card card-hover service-card";
      a.href = "booking.html?service=" + encodeURIComponent(s.id);
      a.innerHTML =
        '<div class="icon">' + SSX.icon(s.icon) + '</div>' +
        '<h3>' + SSX.t("svc." + s.id + ".name") + '</h3>' +
        '<p>' + SSX.t("svc." + s.id + ".desc") + '</p>' +
        '<div class="card-foot"><span class="price">' + SSX.helpers.fmt(s.price) + '<small data-i18n="price.per30"></small></span>' +
        '<span class="card-link">' + SSX.t("home.btnHowNow") + ' →</span></div>';
      grid.appendChild(a);
    });
  </script>
</body>
</html>
